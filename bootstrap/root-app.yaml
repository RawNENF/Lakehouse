apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RawNENF/lakehouse.git   # <-- change this
    targetRevision: main
    path: apps
    directory:
      recurse: true
      include: "*/application.yaml"   # only pick up child Application defs, not apps/*/manifests/*.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true             # if you delete a folder from apps/, Argo CD removes it live
      selfHeal: true           # if someone manually kubectl-edits something, Argo CD reverts it
    syncOptions:
      - CreateNamespace=true
