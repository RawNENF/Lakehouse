apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels: { app: iceberg-rest }
  template:
    metadata:
      labels: { app: iceberg-rest }
    spec:
      containers:
        - name: iceberg-rest
          image: tabulario/iceberg-rest:1.6.0
          ports:
            - containerPort: 8181
          env:
            - name: CATALOG_URI
              value: "jdbc:postgresql://postgres.lakehouse.svc.cluster.local:5432/iceberg_catalog"
            - name: CATALOG_JDBC_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: CATALOG_JDBC_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
            - name: CATALOG_WAREHOUSE
              value: "s3a://iceberg-warehouse/"
            - name: CATALOG_IO__IMPL
              value: "org.apache.iceberg.aws.s3.S3FileIO"
            - name: CATALOG_S3_ENDPOINT
              # Rook's OBC ConfigMap gives us the RGW host/port for the "lakehouse-store" service
              value: "http://lakehouse-store.rook-ceph.svc.cluster.local"
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: iceberg-warehouse, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: iceberg-warehouse, key: AWS_SECRET_ACCESS_KEY }
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits: { cpu: "500m", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: lakehouse
spec:
  selector: { app: iceberg-rest }
  ports:
    - port: 8181
      targetPort: 8181
