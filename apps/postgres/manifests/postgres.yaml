apiVersion: v1
kind: Namespace
metadata:
  name: lakehouse
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: lakehouse
type: Opaque
stringData:
  # CHANGE THIS before pushing to a real/shared repo — this is a placeholder for the sim.
  # For anything beyond a personal laptop POC, use Sealed Secrets or SOPS instead of plaintext.
  POSTGRES_USER: iceberg
  POSTGRES_PASSWORD: changeme-lakehouse
  POSTGRES_DB: iceberg_catalog
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: lakehouse
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: postgres-credentials }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # avoids "lost+found" issues on fresh RBD volumes
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lakehouse
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
