apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: lakehouse-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.4   # Reef — pin deliberately
  dataDirHostPath: /var/lib/rook
  mon:
    count: 3          # one mon per node — needs quorum, 3 is the standard minimum
    allowMultiplePerNode: false
  mgr:
    count: 1
  dashboard:
    enabled: true
    ssl: false        # fine for local sim; wouldn't do this on anything internet-facing
  storage:
    storageClassDeviceSets:
      - name: osd-set
        count: 3
        portable: false
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              resources:
                requests:
                  storage: 10Gi
              storageClassName: standard
              volumeMode: Filesystem
              accessModes:
                - ReadWriteOnce
  resources:
    mon:
      limits: { cpu: "500m", memory: "512Mi" }
    mgr:
      limits: { cpu: "500m", memory: "512Mi" }
    osd:
      limits: { cpu: "1", memory: "1Gi" }
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 60s
