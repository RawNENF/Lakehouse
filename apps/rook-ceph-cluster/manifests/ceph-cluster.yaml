apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: lakehouse-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.4   # Reef — pin deliberately
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1          # dropped from 3 due to quorum churn under CPU pressure
    allowMultiplePerNode: false
  mgr:
    count: 1
  dashboard:
    enabled: true
    ssl: false        # fine for local sim; wouldn't do this on anything internet-facing
  storage:
    # PVC-based OSDs, backed by local PersistentVolumes wrapping loop devices
    # (see local-storage.yaml in this folder). We tried raw devices directly
    # (Rook rejects loop-type devices during discovery) and Filesystem-mode PVCs
    # via local-path-provisioner (Rook's PVC-based OSD mode requires Block mode,
    # which local-path-provisioner can't provide) before landing on this —
    # local PVs in Block mode is the same pattern Rook's own CI uses for testing
    # OSDs on loop devices.
    storageClassDeviceSets:
      - name: osd-set
        count: 3
        portable: false
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              resources:
                requests:
                  storage: 10Gi
              storageClassName: local-storage
              volumeMode: Block
              accessModes:
                - ReadWriteOnce
  resources:
    mon:
      limits: { cpu: "500m", memory: "512Mi" }
    mgr:
      limits: { cpu: "500m", memory: "512Mi" }
    osd:
      limits: { cpu: "1", memory: "1Gi" }
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 60s
    livenessProbe:
      mon:
        disabled: false
        probe:
          timeoutSeconds: 30
    startupProbe:
      mon:
        disabled: false
        probe:
          timeoutSeconds: 30
          failureThreshold: 10
