apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: lakehouse-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v18.2.4   # Reef — pin deliberately
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1          # dropped from 3: on constrained hardware, 3-way quorum kept
                       # churning (mon health-check timeouts under CPU pressure ->
                       # Rook fails the mon over -> new mon adds more load -> repeat).
                       # 1 mon has no quorum to lose, so this failure mode goes away
                       # entirely. Real tradeoff (no HA), acceptable for a solo POC.
    allowMultiplePerNode: false
  mgr:
    count: 1
  dashboard:
    enabled: true
    ssl: false        # fine for local sim; wouldn't do this on anything internet-facing
  storage:
    # Raw devices — the simplest possible config, and now viable because these
    # are real attached disks (TYPE=disk), not loop devices. Rook's auto-discovery
    # rejects loop-type devices outright regardless of how they're wrapped (we
    # tried both raw and PVC-based OSD modes); real disks have no such issue.
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "lakehouse-control-plane"
        devices:
          - name: "sdb"
      - name: "lakehouse-worker"
        devices:
          - name: "sdc"
      - name: "lakehouse-worker2"
        devices:
          - name: "sdd"
  resources:
    mon:
      limits: { cpu: "500m", memory: "512Mi" }
    mgr:
      limits: { cpu: "500m", memory: "512Mi" }
    osd:
      limits: { cpu: "1", memory: "1Gi" }
  healthCheck:
    daemonHealth:
      mon:
        interval: 45s
      osd:
        interval: 60s
    livenessProbe:
      mon:
        disabled: false
        probe:
          timeoutSeconds: 30    # default 5s was too tight on constrained hardware —
                                 # the mon daemon itself was healthy, just the probe's
                                 # own `ceph` CLI call was slow under CPU pressure
    startupProbe:
      mon:
        disabled: false
        probe:
          timeoutSeconds: 30
          failureThreshold: 10  # give it more attempts before giving up during startup
