apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  namespace: lakehouse
spec:
  replicas: 1   # bump this if you have RAM to spare; each worker wants ~1-2Gi
  selector:
    matchLabels: { app: trino-worker }
  template:
    metadata:
      labels: { app: trino-worker, role: trino }
    spec:
      containers:
        - name: trino
          image: trinodb/trino:465
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: iceberg-warehouse }
          volumeMounts:
            - { name: config, mountPath: /etc/trino/jvm.config, subPath: jvm.config }
            - { name: config, mountPath: /etc/trino/node.properties, subPath: node.properties }
            - { name: config, mountPath: /etc/trino/config.properties, subPath: worker-config.properties }
            - { name: config, mountPath: /etc/trino/catalog/iceberg.properties, subPath: iceberg.properties }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "1", memory: "2Gi" }
      volumes:
        - name: config
          configMap: { name: trino-config }
